permissions:
  contents: read

name: build

# Build & test on every PR, every push to main, and on demand. The .NET 11
# SDK is installed explicitly via setup-dotnet so the build does not depend on
# whichever SDKs the windows-latest image happens to preinstall — see
# Docs/Architecture/ReleaseStrategy.md for the original trade-off.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Restore NuGet package cache
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-build-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-build-${{ github.job }}-
            ${{ runner.os }}-nuget-
      - name: Verify R2 transfer protocol offline
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE '.github/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Restore
        run: dotnet restore NAudio.slnx
      - name: Save NuGet package cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Build
        run: dotnet build NAudio.slnx --configuration Release --no-restore

      - name: Test
        # `dotnet test` against the slnx runs every test project. On
        # Windows that's NAudio.Core.Tests + NAudio.Windows.Tests plus
        # the SoundFile/Alsa suites (which self-skip when their native
        # deps are absent). The --solution flag is required by newer
        # .NET SDKs (10.0 and later); positional arg form errors out.
        run: >
          dotnet test --solution NAudio.slnx
          --configuration Release
          --no-build
          --filter "TestCategory!=IntegrationTest"
          --report-trx
          --results-directory ${{ runner.temp }}/TestResults

      - name: Pack shipping packages
        # Verify packaging for the same 15 shipping projects as the release workflow.
        shell: pwsh
        run: |
          foreach ($proj in Get-ChildItem src -Filter *.csproj -Recurse) {
            dotnet pack $proj.FullName --configuration Release --no-build --output "${{ runner.temp }}/packages"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

  aot:
    # The trim/AOT analyzers that run during the normal build only flag APIs
    # annotated [RequiresDynamicCode] / [RequiresUnreferencedCode], so they are
    # blind to whole classes of AOT breakage. Issue #1425 — marshalling a
    # [StructLayout] class by value, which CoreCLR pins in place but NativeAOT
    # copies into a temporary — produced zero analyzer warnings while being
    # thoroughly broken under AOT. Publishing NAudioAotSmokeTest runs ILC for
    # real, catching whole-program analysis and native link failures that the
    # analyzers cannot see.
    #
    # Publish only, not run: the smoke test drives real render endpoints and
    # master volume, which CI agents don't have. See tests/NAudioAotSmokeTest.
    #
    # A separate job so it runs in parallel with `build` rather than adding the
    # ILCompiler download and native link to the critical path.
    name: aot-publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Restore NuGet package cache
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-build-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-build-${{ github.job }}-
            ${{ runner.os }}-nuget-
      - name: Publish Native AOT smoke test
        # The csproj already sets PublishAot and RuntimeIdentifier=win-x64, so
        # this needs no extra flags. windows-latest ships the MSVC toolchain
        # that ILC needs for the native link step.
        run: dotnet publish tests/NAudioAotSmokeTest/NAudioAotSmokeTest.csproj --configuration Release
      - name: Save NuGet package cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Publish and run the ASIO fake-driver test (Native AOT)
        # Unlike the smoke test above, this one needs no hardware: it drives NAudio.Asio's
        # vtable binding, struct layouts and callbacks against an in-process fake driver, so CI
        # can run the AOT-compiled executable, not just build it. That's what catches interop
        # that compiles cleanly but misbehaves under AOT (#1425). Exits non-zero on any failure.
        shell: pwsh
        run: |
          dotnet publish tests/NAudioAsioFakeDriverTest/NAudioAsioFakeDriverTest.csproj --configuration Release --runtime win-x64 --output "${{ runner.temp }}/asio-fake-driver"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/asio-fake-driver/NAudioAsioFakeDriverTest.exe"
          exit $LASTEXITCODE
