name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'src/**/*.cs'
      - 'docfx/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/check-docs-toc.cs'
      - '.github/scripts/CheckDocsToc.csproj'
  pull_request:
    paths:
      - 'Docs/**'
      - 'src/**/*.cs'
      - 'docfx/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/check-docs-toc.cs'
      - '.github/scripts/CheckDocsToc.csproj'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # windows-latest so the Windows-only projects (WASAPI, ASIO, WinMM, DMO,
    # WinForms) generate API metadata without EnableWindowsTargeting shims.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Check every tutorial is in the TOC
        run: dotnet run --project .github/scripts/CheckDocsToc.csproj

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build docs
        run: docfx docfx/docfx.json --warningsAsErrors

      - name: Upload Pages artifact
        # Only needed for the deploy job, which only runs on main.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docfx/_site
          # v3 archived dotfiles; v5 drops them unless asked. DocFX doesn't
          # emit any today, but keep the old behaviour rather than find out.
          include-hidden-files: true

  deploy:
    # Publish to GitHub Pages only from main.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.ref == 'refs/heads/main') }}
    needs: build
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
