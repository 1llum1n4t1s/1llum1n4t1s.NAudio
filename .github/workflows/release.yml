name: release

# Two triggers:
#   - workflow_dispatch (manual): cuts a pre-release. By default produces
#     "<VersionPrefix>-preview.<run_number>"; an optional `milestone` input
#     overrides the suffix (e.g. "alpha.1", "beta.2", "rc.1").
#   - push of a v* tag: cuts a final release matching <VersionPrefix>.
# See Docs/Architecture/ReleaseStrategy.md for the broader release flow.
on:
  workflow_dispatch:
    inputs:
      milestone:
        description: "Optional pre-release label (e.g. alpha.1, beta.2, rc.1). Leave blank for auto preview.<run_number>."
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write    # for `gh release create`
  id-token: write    # for NuGet.org Trusted Publishing

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $header = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Output "::add-mask::$header"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.extraHeader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $header"
          try {
            git fetch --force --tags origin $env:CHECKOUT_REF
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git checkout --detach FETCH_HEAD
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            $env:GIT_CONFIG_COUNT = $null
            $env:GIT_CONFIG_KEY_0 = $null
            $env:GIT_CONFIG_VALUE_0 = $null
          }

      # Dispatch must come from main. Tag pushes are unrestricted because
      # the tag itself is the gate.
      - name: Verify branch (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            Write-Error "Release dispatch must be from main (got $env:GITHUB_REF)."
            exit 1
          }

      - name: Prepare temporary output
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP "Codex\NAudio-release-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $outputPath | Out-Null
          "RELEASE_OUTPUT_DIR=$outputPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $prefix = $props.Project.PropertyGroup.VersionPrefix
          if (-not $prefix) {
            Write-Error "VersionPrefix not found in Directory.Build.props"
            exit 1
          }

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF -replace 'refs/tags/v',''
            if ($tagVersion -ne $prefix) {
              Write-Error "Tag v$tagVersion does not match VersionPrefix $prefix in Directory.Build.props. Bump the prefix and retag."
              exit 1
            }
            $version = $tagVersion
            $packArgs = ""
            $isFinal = 'true'
          } else {
            $milestone = '${{ inputs.milestone }}'
            if ([string]::IsNullOrWhiteSpace($milestone)) {
              $suffix = "preview.${{ github.run_number }}"
            } else {
              $suffix = $milestone.Trim()
            }
            $version = "$prefix-$suffix"
            $packArgs = "-p:VersionSuffix=$suffix"
            $isFinal = 'false'
          }

          Write-Host "Resolved version: $version (is_final=$isFinal)"
          "version=$version"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_final=$isFinal"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pack_args=$packArgs"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Extract the right section from CHANGELOG.md into release-body.md.
      # Final releases use the '## [<version>]' section (and must have one,
      # else fail-fast). Pre-releases use the '## [Unreleased]' section if it
      # exists; otherwise the file is just empty and the package ships with
      # no release notes. The same release-body.md feeds both the pack step
      # (via -p:PackageReleaseNotesFile so NuGet displays the notes on the
      # package page) and the GitHub Release body (finals only).
      - name: Extract CHANGELOG.md section
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $isFinal = '${{ steps.version.outputs.is_final }}' -eq 'true'
          New-Item -ItemType Directory -Force -Path $env:RELEASE_OUTPUT_DIR | Out-Null
          $notesPath = Join-Path $env:RELEASE_OUTPUT_DIR 'release-body.md'

          if ($isFinal) {
            $pattern = "^## \[$([regex]::Escape($version))\](\s|$)"
            $label = "## [$version]"
          } else {
            $pattern = "^## \[Unreleased\](\s|$)"
            $label = "## [Unreleased]"
          }

          $lines = Get-Content CHANGELOG.md
          $start = -1
          $end = $lines.Length
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match $pattern) {
              $start = $i + 1
            } elseif ($start -ge 0 -and $lines[$i] -match "^## ") {
              $end = $i
              break
            }
          }

          if ($start -lt 0) {
            if ($isFinal) {
              Write-Error "CHANGELOG.md has no '$label' section. Rename '## [Unreleased]' to '## [$version] - YYYY-MM-DD' before tagging."
              exit 1
            } else {
              Write-Warning "CHANGELOG.md has no '$label' section; package release notes will be empty."
              "" | Out-File -FilePath $notesPath -Encoding utf8
            }
          } else {
            $body = $lines[$start..($end - 1)] -join "`n"
            # Strip HTML comments — useful for contributors editing
            # CHANGELOG.md but noisy on the NuGet page / GitHub Release.
            $body = [regex]::Replace($body, '<!--[\s\S]*?-->', '').Trim()

            # NuGet.org caps PackageReleaseNotes at 35,000 characters and
            # rejects an oversized package at *push* time — i.e. after a
            # successful pack, part-way through the release, with the tag
            # already pushed. Fail here instead, before anything is built.
            $limit = 35000
            if ($body.Length -gt $limit) {
              Write-Error "Release notes section '$label' is $($body.Length) chars, over NuGet's $limit-character PackageReleaseNotes limit. Trim CHANGELOG.md — keep headline features and breaking changes, and let the auto-generated PR list on the GitHub Release carry the per-commit detail."
              exit 1
            }

            $body | Out-File -FilePath $notesPath -Encoding utf8
            Write-Host "Extracted '$label' ($($body.Length) of $limit chars) to release-body.md."
          }

      - name: Restore
        run: dotnet restore NAudio.slnx

      - name: Build
        run: dotnet build NAudio.slnx --configuration Release --no-restore ${{ steps.version.outputs.pack_args }}

      - name: Test
        run: >
          dotnet test --solution NAudio.slnx
          --configuration Release
          --no-build
          --filter "TestCategory!=IntegrationTest"

      # Pack the NAudio NuGet packages explicitly so we don't accidentally
      # ship the tool/sample apps. Tools (MixDiff, AudioFileInspector,
      # MidiFileConverter) keep their own <Version> in csproj but we never
      # publish them to NuGet. NAudio.Alsa, NAudio.SoundFile and NAudio.MacOS are the
      # cross-platform backend/codec packages — net10.0 (no -windows TFM),
      # so they build and pack fine on the windows-latest runner; their
      # *.Tests projects are IsPackable=false and excluded here.
      #
      # NAudio.MacOS is the one package that does not follow the lockstep
      # stability level: it always packs pre-release, even on a final tag run.
      # Its csproj supplies the suffix without changing NAudio.Core's version.
      - name: Pack
        shell: pwsh
        run: |
          $packages = @(
            'NAudio.Core',
            'NAudio.Asio',
            'NAudio.WinForms',
            'NAudio.Midi',
            'NAudio.WinMM',
            'NAudio.Wasapi',
            'NAudio.Dmo',
            'NAudio.Vst3',
            'NAudio.Alsa',
            'NAudio.SoundFile',
            'NAudio.MacOS',
            'NAudio.Sampler',
            'NAudio',
            'NAudio.Extras'
          )
          $notesPath = Join-Path $env:RELEASE_OUTPUT_DIR "release-body.md"
          New-Item -ItemType Directory -Force -Path $env:RELEASE_OUTPUT_DIR | Out-Null
          foreach ($pkg in $packages) {
            dotnet pack "src/$pkg/$pkg.csproj" `
              --configuration Release `
              --no-build `
              --output $env:RELEASE_OUTPUT_DIR `
              -p:PackageReleaseNotesFile="$notesPath" `
              ${{ steps.version.outputs.pack_args }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload package artifacts
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./.github/scripts/R2Artifact.Common.ps1
          $files = @(Get-ChildItem -Path (Join-Path $env:RELEASE_OUTPUT_DIR '*.nupkg'), (Join-Path $env:RELEASE_OUTPUT_DIR '*.snupkg') -File | Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) { throw 'No NuGet package artifacts found.' }
          Publish-R2Artifact -AccountId $env:R2_ACCOUNT_ID -Bucket $env:R2_BUCKET -AccessKeyId $env:R2_ACCESS_KEY_ID -SecretAccessKey $env:R2_SECRET_ACCESS_KEY -Name 'nupkg-${{ steps.version.outputs.version }}' -Path $files

      - name: Authenticate to NuGet.org
        id: login
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:NUGET_USER -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN -or -not $env:ACTIONS_ID_TOKEN_REQUEST_URL) {
            throw 'NuGet user and GitHub OIDC permissions are required.'
          }
          Write-Output "::add-mask::$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          try {
            $url = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$([uri]::EscapeDataString('https://www.nuget.org'))"
            $oidc = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            if (-not $oidc.value) { throw 'Missing OIDC token.' }
            Write-Output "::add-mask::$($oidc.value)"
            $body = @{ username = $env:NUGET_USER; tokenType = 'ApiKey' } | ConvertTo-Json -Compress
            $result = Invoke-RestMethod -Method Post -Uri 'https://www.nuget.org/api/v2/token' -Headers @{ Authorization = "Bearer $($oidc.value)" } -ContentType 'application/json' -Body $body
            if (-not $result.apiKey -or $result.apiKey -match '[\r\n]') { throw 'Missing or invalid NuGet API key.' }
            Write-Output "::add-mask::$($result.apiKey)"
            "NUGET_API_KEY=$($result.apiKey)" >> $env:GITHUB_OUTPUT
          } catch {
            throw 'NuGet Trusted Publishing authentication failed.'
          }

      # dotnet nuget push does not expand globs on its own, and PowerShell
      # does not expand wildcards in arguments to external commands. So loop
      # over the artifacts explicitly. This also gives per-package error
      # reporting. We iterate .nupkg files only; the matching .snupkg
      # symbol packages sitting next to each .nupkg are pushed automatically
      # by `dotnet nuget push` in the same call.
      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = Get-ChildItem -LiteralPath $env:RELEASE_OUTPUT_DIR -Filter '*.nupkg'
          if (-not $packages) {
            Write-Error "No .nupkg files found in $env:RELEASE_OUTPUT_DIR"
            exit 1
          }
          foreach ($pkg in $packages) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push $($pkg.Name)"
              exit $LASTEXITCODE
            }
          }

      # GitHub Release only on final tag-driven runs. Pre-releases just
      # ship to NuGet — no GitHub Release noise for every preview. The
      # release-body.md file was already produced by the earlier
      # "Extract CHANGELOG.md section" step.
      #
      # The .nupkg files are attached as release assets. The package directory is still
      # on disk from the Pack step, so there is no artifact round-trip. This
      # also gives a permanent copy of exactly what shipped: private R2 artifacts
      # follow the bucket lifecycle, while release assets do not. Symbol packages
      # are deliberately left off — they go to NuGet's symbol server and would
      # only double the asset list here.
      #
      # gh does not expand globs, and PowerShell does not expand wildcards in
      # arguments to external commands, so the file list is built explicitly —
      # same reason as the Push step above.
      - name: Create GitHub Release (final only)
        if: steps.version.outputs.is_final == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath $env:RELEASE_OUTPUT_DIR -Filter '*.nupkg' | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            Write-Error "No .nupkg files found in $env:RELEASE_OUTPUT_DIR to attach to the release"
            exit 1
          }
          Write-Host "Attaching $($assets.Count) package(s) to the release"
          gh release create "v${{ steps.version.outputs.version }}" `
            --title "1llum1n4t1s.NAudio ${{ steps.version.outputs.version }}" `
            --notes-file (Join-Path $env:RELEASE_OUTPUT_DIR 'release-body.md') `
            --verify-tag `
            @assets
