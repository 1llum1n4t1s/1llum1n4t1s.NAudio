version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    # NAudio.slnx (root) が NAudio/ Tests/ ProcessLoopbackTestApp/ の各 csproj を参照する構成。
    # directory: "/" だけでサブディレクトリの csproj まで再帰的に検出されるかを公式ドキュメントで
    # 確認できなかったため、実在する各ディレクトリを明示指定する (global.json / Directory.Build.props
    # は root で検出させる)。
    directories:
      - "/"
      - "/NAudio"
      - "/Tests"
      - "/ProcessLoopbackTestApp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
